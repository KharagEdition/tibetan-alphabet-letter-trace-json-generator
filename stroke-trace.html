<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tibetan Letter Tracing</title>
<style>
  :root {
    --bg: #0F1420;
    --panel: #1A2130;
    --panel-2: #222B3E;
    --line: #2E3950;
    --text: #EAF0FA;
    --muted: #8B95AB;
    --accent: #4F8DFD;
    --ink: #3B82F6;
    --good: #22C55E;
    --warn: #F59E0B;
    --bad: #EF4444;
    --ghost: #2A3450;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
  }

  header {
    width: 100%; max-width: 720px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 4px;
  }
  .title { display: flex; align-items: baseline; gap: 10px; }
  .title .glyph { font-size: 34px; line-height: 1; }
  .title .roman { font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .hbtns { display: flex; gap: 8px; }
  button {
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); border-radius: 12px;
    font-size: 14px; font-weight: 600; padding: 9px 13px;
    cursor: pointer; transition: background .15s, transform .1s;
    user-select: none;
  }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); border-color: transparent; }
  button.icon { font-size: 17px; padding: 8px 11px; }

  .stage-wrap {
    position: relative;
    flex: 1; width: 100%; max-width: 720px;
    display: flex; align-items: center; justify-content: center;
    padding: 6px 12px;
    min-height: 0;
  }
  #stage {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    touch-action: none;
    display: block;
    max-width: 100%; max-height: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }

  .strokebar {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    padding: 4px 0 2px; min-height: 26px;
  }
  .sdot {
    width: 26px; height: 8px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--line);
    transition: background .25s;
  }
  .sdot.done { background: var(--good); border-color: transparent; }
  .sdot.now  { background: var(--accent); border-color: transparent; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  footer {
    width: 100%; max-width: 720px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 6px 16px 14px;
  }
  .nav-arrows { display: flex; gap: 8px; }

  /* letter picker sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(8,12,22,.72); backdrop-filter: blur(6px);
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet.open { display: flex; }
  .sheet-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 22px 22px 0 0;
    width: 100%; max-width: 720px; max-height: 78dvh;
    padding: 18px; overflow-y: auto;
  }
  .sheet-card h3 { font-size: 15px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
  .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 10px; }
  .lcell {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 4px 8px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .lcell:hover { border-color: var(--accent); }
  .lcell.sel { border-color: var(--accent); background: #24304a; }
  .lcell .g { font-size: 30px; line-height: 1.25; }
  .lcell .r { font-size: 11px; color: var(--muted); font-weight: 600; }
  .lcell .done-mark { color: var(--good); font-size: 11px; font-weight: 700; }

  /* completion overlay */
  .celebrate {
    position: absolute; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; border-radius: var(--radius);
    background: rgba(10,15,26,.55); backdrop-filter: blur(3px);
    animation: fadeIn .3s;
  }
  .celebrate.open { display: flex; }
  .celebrate .big { font-size: 120px; line-height: 1.1; filter: drop-shadow(0 8px 30px rgba(79,141,253,.45)); animation: pop .5s cubic-bezier(.2,1.8,.4,1); }
  .celebrate .msg { font-size: 20px; font-weight: 700; }
  .celebrate .sub { font-size: 14px; color: var(--muted); }
  @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } }

  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="title">
    <div class="glyph" id="hGlyph">ཀ</div>
    <div class="roman" id="hRoman">ka</div>
  </div>
  <div class="hbtns">
    <button class="icon" id="btnHint"  title="Show me">👁</button>
    <button class="icon" id="btnReset" title="Start over">↺</button>
    <button class="icon" id="btnLoad"  title="Load custom JSON">📂</button>
    <button class="icon" onclick="location.href='index.html'" title="Stroke studio (edit + trace)">✎</button>
    <button class="icon" id="btnGrid"  title="All letters">▦</button>
  </div>
</header>

<div class="stage-wrap">
  <canvas id="stage"></canvas>
  <div class="celebrate" id="celebrate">
    <div class="big" id="cGlyph">ཀ</div>
    <div class="msg">Perfect! ✨</div>
    <div class="sub" id="cSub">ka</div>
    <button class="primary" id="btnNext2">Next letter →</button>
  </div>
</div>

<div class="strokebar" id="strokebar"></div>

<footer>
  <div class="nav-arrows">
    <button id="btnPrev">←</button>
    <button id="btnNext">→</button>
  </div>
  <div style="color:var(--muted);font-size:13px;font-weight:600" id="footInfo"></div>
</footer>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <h3>Choose a letter</h3>
    <div class="lgrid" id="lgrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="loadSheet">
  <div class="sheet-card">
    <h3>Load custom letter data</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">
      Pick a <b>letters.json</b> file (from the studio or
      <code>generate-strokes.cjs</code>) or paste the JSON below. Custom data is
      remembered until you switch back to the built-in letters.
    </p>
    <input type="file" id="jsonFile" accept=".json,application/json"
           style="margin-bottom:10px;color:var(--muted);font-size:13px">
    <textarea id="jsonPaste" placeholder='{"version":1,"viewBox":1000,"letters":[...]}'
      style="width:100%;height:140px;background:var(--panel-2);border:1px solid var(--line);
             border-radius:10px;color:var(--text);font-family:monospace;font-size:12px;
             padding:10px;resize:vertical;margin-bottom:12px"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" id="btnApplyJson">Load JSON</button>
      <button id="btnBuiltin">Use built-in letters</button>
      <button id="btnCloseLoad">Cancel</button>
    </div>
  </div>
</div>

<script src="letters.js?v=5"></script>
<script src="trace-core.js?v=2"></script>
<script>
'use strict';
/* ============================================================
   Tibetan letter tracing — game chrome around the shared
   TraceCore engine (trace-core.js). The engine pre-partitions
   every ink pixel of the glyph among the strokes (region
   reveal), so tracing paints the exact letterform with zero
   gaps, blobs or cut-offs, and validates input with monotonic
   arc-length progress.
   ============================================================ */

const TC = window.TraceCore;

const BUILTIN = (() => {
  try { return TC.normalizeDoc(window.LETTERS_DATA); } catch (e) { return []; }
})();
let LETTERS = BUILTIN;
let usingCustom = false;
try {
  const saved = localStorage.getItem('trace_custom_data');
  if (saved) { LETTERS = TC.normalizeDoc(JSON.parse(saved)); usingCustom = true; }
} catch (e) { localStorage.removeItem('trace_custom_data'); }

const stage = document.getElementById('stage');
let cur = 0;
let letter = null;
const doneSet = new Set(JSON.parse(localStorage.getItem('trace_done_v2') || '[]'));

const engine = window.__engine = new TC.TraceEngine(stage, {
  onStrokeChange: buildStrokebar,
  onComplete: L => {
    doneSet.add(letter.id);
    localStorage.setItem('trace_done_v2', JSON.stringify([...doneSet]));
    setTimeout(() => {
      document.getElementById('cGlyph').textContent = letter.glyph;
      document.getElementById('cSub').textContent = (letter.roman || letter.id) + ' — traced!';
      document.getElementById('celebrate').classList.add('open');
    }, 900);
  }
});

function fit() {
  const wrap = stage.parentElement;
  const w = wrap.clientWidth - 24, h = wrap.clientHeight - 12;
  engine.resize(Math.max(280, Math.min(w, h)));
}
window.addEventListener('resize', fit);

function loadLetter(i) {
  cur = (i + LETTERS.length) % LETTERS.length;
  letter = LETTERS[cur];
  document.getElementById('hGlyph').textContent = letter.glyph;
  document.getElementById('hRoman').textContent = letter.roman || letter.id;
  document.getElementById('footInfo').textContent =
    `${cur + 1} / ${LETTERS.length}` + (usingCustom ? ' · custom' : '');
  document.getElementById('celebrate').classList.remove('open');
  engine.setLetter(letter);
  buildGridSel();
}

function buildStrokebar(si, total, finished) {
  const bar = document.getElementById('strokebar');
  bar.innerHTML = '';
  for (let k = 0; k < total; k++) {
    const d = document.createElement('div');
    d.className = 'sdot' + (k < si || finished ? ' done' : k === si ? ' now' : '');
    bar.appendChild(d);
  }
}

/* ============================ chrome ============================ */
function buildGrid() {
  const grid = document.getElementById('lgrid');
  grid.innerHTML = '';
  LETTERS.forEach((L, i) => {
    const c = document.createElement('div');
    c.className = 'lcell' + (i === cur ? ' sel' : '');
    c.innerHTML = `<div class="g">${L.glyph}</div><div class="r">${L.roman || L.id}</div>` +
      (doneSet.has(L.id) ? '<div class="done-mark">✓</div>' : '');
    c.onclick = () => { document.getElementById('sheet').classList.remove('open'); loadLetter(i); };
    grid.appendChild(c);
  });
}
function buildGridSel() { if (document.getElementById('sheet').classList.contains('open')) buildGrid(); }

document.getElementById('btnGrid').onclick = () => { buildGrid(); document.getElementById('sheet').classList.add('open'); };
document.getElementById('sheet').addEventListener('click', e => {
  if (e.target === document.getElementById('sheet')) e.currentTarget.classList.remove('open');
});
document.getElementById('btnReset').onclick = () => loadLetter(cur);
document.getElementById('btnHint').onclick = () => {
  document.getElementById('celebrate').classList.remove('open');
  engine.demo();
};
document.getElementById('btnPrev').onclick = () => loadLetter(cur - 1);
document.getElementById('btnNext').onclick = () => loadLetter(cur + 1);
document.getElementById('btnNext2').onclick = () => loadLetter(cur + 1);

/* ---- custom JSON loading ---- */
const loadSheet = document.getElementById('loadSheet');
document.getElementById('btnLoad').onclick = () => loadSheet.classList.add('open');
document.getElementById('btnCloseLoad').onclick = () => loadSheet.classList.remove('open');
loadSheet.addEventListener('click', e => {
  if (e.target === loadSheet) loadSheet.classList.remove('open');
});
document.getElementById('jsonFile').onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  f.text().then(t => { document.getElementById('jsonPaste').value = t; })
    .catch(() => toast('Could not read that file'));
};
document.getElementById('btnApplyJson').onclick = () => {
  const txt = document.getElementById('jsonPaste').value.trim();
  if (!txt) { toast('Choose a file or paste JSON first'); return; }
  try {
    const letters = TC.normalizeDoc(JSON.parse(txt));
    LETTERS = letters;
    usingCustom = true;
    try { localStorage.setItem('trace_custom_data', txt); }
    catch (q) { toast('Loaded (too large to remember across reloads)'); }
    loadSheet.classList.remove('open');
    loadLetter(0);
    toast(`Loaded ${letters.length} custom letter${letters.length > 1 ? 's' : ''}`);
  } catch (err) {
    toast('Invalid JSON: ' + err.message);
  }
};
document.getElementById('btnBuiltin').onclick = () => {
  localStorage.removeItem('trace_custom_data');
  LETTERS = BUILTIN;
  usingCustom = false;
  loadSheet.classList.remove('open');
  if (LETTERS.length) loadLetter(0);
  toast('Built-in letters restored');
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============================ boot ============================ */
if (!LETTERS.length) {
  document.body.innerHTML = '<p style="margin:40px;font-size:16px">letters.js not found or empty — run <code>node generate-strokes.cjs</code> first.</p>';
} else {
  fit();
  loadLetter(0);
}
</script>
</body>
</html>
